<g fill="#c3d3ff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600"><text x="428" y="276">Learn</text><text x="428" y="306">Build</text><text x="428" y="336">Achieve</text></g>
<rect x="540" y="150" width="100" height="360" fill="#7a80cf" opacity=".35"/>
<rect x="420" y="440" width="86" height="76" fill="#27308f"/><rect x="420" y="440" width="86" height="76" fill="url(#win)" opacity=".5"/>
