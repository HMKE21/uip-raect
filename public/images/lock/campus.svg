<g fill="#2b2c70"><rect x="346" y="440" width="5" height="70"/><circle cx="348" cy="430" r="34"/><rect x="223" y="465" width="4" height="45"/><circle cx="225" cy="455" r="22"/><rect x="518" y="420" width="6" height="90"/><circle cx="522" cy="408" r="44"/><circle cx="610" cy="330" r="62"/></g>
<g fill="#ffd6a0"><circle cx="446" cy="506" r="3"/><circle cx="575" cy="502" r="3"/><circle cx="105" cy="508" r="2.5"/></g>
