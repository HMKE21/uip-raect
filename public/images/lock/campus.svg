<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" preserveAspectRatio="xMaxYMax slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a50c6"/><stop offset=".55" stop-color="#6b5fd3"/><stop offset="1" stop-color="#c27fd2"/></linearGradient>
<radialGradient id="glow" cx="0" cy=".62" r=".7"><stop offset="0" stop-color="#ffb98f" stop-opacity=".85"/><stop offset=".5" stop-color="#ff9fb8" stop-opacity=".3"/><stop offset="1" stop-color="#ff9fb8" stop-opacity="0"/></radialGradient>
<linearGradient id="wall" x1="0" x2="1"><stop offset="0" stop-color="#d9dcf7"/><stop offset="1" stop-color="#8d93d9"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a52c0"/><stop offset="1" stop-color="#6a5fcf"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3b9f"/><stop offset="1" stop-color="#ffcf9a"/></linearGradient>
<pattern id="win" width="18" height="22" patternUnits="userSpaceOnUse"><rect x="3" y="4" width="11" height="14" rx="1.5" fill="#ffe3b4" opacity=".85"/></pattern>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
<rect width="640" height="780" fill="url(#sky)"/>
<rect width="640" height="780" fill="url(#glow)"/>
