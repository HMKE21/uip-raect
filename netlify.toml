[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Backend proxy (the app calls relative /api and /uploads URLs)
[[redirects]]
  from = "/api/*"
  to = "https://uip-laravel-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://uip-laravel-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

# SPA fallback so deep links like /projects/abc work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for the React app (CSP = second line of defence against XSS).
# Keep this block identical to vercel.json.
# connect-src: `wss:` lets the meeting WebSocket (Reverb) connect; once you know the host,
# tighten it to e.g. `wss://reverb.example.com` (+ `https://reverb.example.com` for HTTP fallback).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: wss: ws://localhost:8787 https://uip-laravel-production.up.railway.app https://accounts.google.com/gsi/; frame-src 'self' blob: http://*.localhost:8787 https://uip-run.vercel.app https://*.sandbox-previews.example.com https://accounts.google.com/gsi/ https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=(self), clipboard-read=(self), clipboard-write=(self), fullscreen=(self), picture-in-picture=(self), autoplay=(self), screen-wake-lock=(self), web-share=(self), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
