[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Backend proxy (the app calls relative /api and /uploads URLs)
[[redirects]]
  from = "/api/*"
  to = "https://uip-laravel-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://uip-laravel-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

# SPA fallback so deep links like /projects/abc work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# OCR engine + background-blur model: the Android app downloads them from here on first use (they are not packed in the APK).
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# Long cache for the fingerprinted build files + static images/icons (same rules as vercel.json).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/font-boot.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/theme-boot.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Uploaded PDFs are never rendered inline (same as vercel.json). Check with: curl -I https://<site>/uploads/<some>.pdf
[[headers]]
  for = "/uploads/*.pdf"
  [headers.values]
    Content-Disposition = "attachment"
    Content-Security-Policy = "sandbox; default-src 'none'"
    X-Content-Type-Options = "nosniff"

# Security headers for the React app (CSP = second line of defence against XSS).
# Keep this block identical to vercel.json.
# connect-src: `wss:` lets the meeting WebSocket (Reverb) connect; once you know the host,
# tighten it to e.g. `wss://reverb.example.com` (+ `https://reverb.example.com` for HTTP fallback).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: https://*.r2.cloudflarestorage.com https://*.amazonaws.com https://www.googleapis.com https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com https://api.onedrive.com https://*.files.1drv.com wss: ws://localhost:8787 https://uip-laravel-production.up.railway.app https://accounts.google.com/gsi/; frame-src 'self' blob: http://*.localhost:8787 https://uip-run.vercel.app https://accounts.google.com/gsi/ https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=(self), clipboard-read=(self), clipboard-write=(self), fullscreen=(self), picture-in-picture=(self), autoplay=(self), screen-wake-lock=(self), web-share=(self), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
